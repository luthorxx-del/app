openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sports
    description: Sport catalog operations
  - name: matches
    description: Match schedules and scorecards
  - name: players
    description: Player profiles
  - name: tournaments
    description: Tournament profiles
  - name: search
    description: Cross-entity search
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sports:
    get:
      operationId: listSports
      tags: [sports]
      summary: List supported sports
      responses:
        "200":
          description: Supported sports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sport"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [matches]
      summary: Get the dashboard match feed
      parameters:
        - $ref: "#/components/parameters/SportId"
      responses:
        "200":
          description: Dashboard feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List matches with optional filters
      parameters:
        - $ref: "#/components/parameters/SportId"
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/PlayerId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MatchStatus"
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get a match scorecard
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /matches/{id}/h2h:
    get:
      operationId: getMatchH2h
      tags: [matches]
      summary: Get dynamic pre-match head-to-head statistics
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Head-to-head statistics and recent meetings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadToHead"
        "404":
          $ref: "#/components/responses/NotFound"
  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player profile
      parameters:
        - $ref: "#/components/parameters/PlayerPathId"
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /players/{id}/form:
    get:
      operationId: getPlayerForm
      tags: [players]
      summary: Get dynamic player form before an optional cutoff
      parameters:
        - $ref: "#/components/parameters/PlayerPathId"
        - $ref: "#/components/parameters/BeforeDate"
        - $ref: "#/components/parameters/Surface"
      responses:
        "200":
          description: Player form windows and recent completed results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerForm"
        "404":
          $ref: "#/components/responses/NotFound"
  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      summary: Get a tournament profile
      parameters:
        - $ref: "#/components/parameters/TournamentPathId"
      responses:
        "200":
          description: Tournament profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search players, tournaments, and matches
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/SportId"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
components:
  parameters:
    SportId:
      name: sportId
      in: query
      schema:
        type: number
        minimum: 1
    TournamentId:
      name: tournamentId
      in: query
      schema:
        type: number
        minimum: 1
    PlayerId:
      name: playerId
      in: query
      schema:
        type: number
        minimum: 1
    MatchId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    PlayerPathId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    TournamentPathId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    BeforeDate:
      name: before
      in: query
      required: false
      description: Only include completed matches before this timestamp.
      schema:
        type: string
        format: date-time
    Surface:
      name: surface
      in: query
      required: false
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MatchStatus:
      type: string
      enum: [upcoming, live, completed]
    Sport:
      type: object
      required: [id, name]
      properties:
        id: { type: number }
        name: { type: string }
    Player:
      type: object
      required: [id, sportId, name, country]
      properties:
        id: { type: number }
        sportId: { type: number }
        name: { type: string }
        country: { type: string }
        currentRanking:
          type: [number, "null"]
    Tournament:
      type: object
      required: [id, sportId, name, region, surface, category, season]
      properties:
        id: { type: number }
        sportId: { type: number }
        name: { type: string }
        region: { type: string }
        surface: { type: string }
        category: { type: string }
        season: { type: number }
    MatchSet:
      type: object
      required: [id, matchId, setNumber, playerAGames, playerBGames]
      properties:
        id: { type: number }
        matchId: { type: number }
        setNumber: { type: number }
        playerAGames: { type: number }
        playerBGames: { type: number }
    Match:
      type: object
      required:
        [id, sportId, tournamentId, tournamentName, playerA, playerB, date, status, winnerId, resultSummary]
      properties:
        id: { type: number }
        sportId: { type: number }
        tournamentId: { type: number }
        tournamentName: { type: string }
        playerA:
          $ref: "#/components/schemas/Player"
        playerB:
          $ref: "#/components/schemas/Player"
        date: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/MatchStatus"
        winnerId:
          type: [number, "null"]
        resultSummary:
          type: [string, "null"]
        sets:
          type: array
          items:
            $ref: "#/components/schemas/MatchSet"
    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/Match"
        - type: object
          required: [tournament, headToHead, playerAForm, playerBForm]
          properties:
            tournament:
              $ref: "#/components/schemas/Tournament"
            headToHead:
              $ref: "#/components/schemas/HeadToHead"
            playerAForm:
              $ref: "#/components/schemas/PlayerForm"
            playerBForm:
              $ref: "#/components/schemas/PlayerForm"
    HeadToHead:
      type: object
      required:
        [totalMeetings, playerAWins, playerBWins, playerAWinPercentage, playerBWinPercentage, matchesBeforeScheduledTime, surfaceBreakdown, recentMeetings]
      properties:
        totalMeetings: { type: number }
        playerAWins: { type: number }
        playerBWins: { type: number }
        playerAWinPercentage: { type: number }
        playerBWinPercentage: { type: number }
        matchesBeforeScheduledTime: { type: number }
        surfaceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/HeadToHeadSurface"
        recentMeetings:
          type: array
          items:
            $ref: "#/components/schemas/HeadToHeadMatch"
    HeadToHeadSurface:
      type: object
      required: [surface, totalMeetings, playerAWins, playerBWins, playerAWinPercentage, playerBWinPercentage]
      properties:
        surface: { type: string }
        totalMeetings: { type: number }
        playerAWins: { type: number }
        playerBWins: { type: number }
        playerAWinPercentage: { type: number }
        playerBWinPercentage: { type: number }
    HeadToHeadMatch:
      type: object
      required: [id, date, tournamentName, surface, playerA, playerB, winnerId, resultSummary]
      properties:
        id: { type: number }
        date: { type: string, format: date-time }
        tournamentName: { type: string }
        surface: { type: string }
        playerA:
          $ref: "#/components/schemas/Player"
        playerB:
          $ref: "#/components/schemas/Player"
        winnerId:
          type: [number, "null"]
        resultSummary:
          type: [string, "null"]
    PlayerForm:
      type: object
      required: [asOf, last5, last10, last20, currentStreakType, currentStreakLength, results, surfaceBreakdown]
      properties:
        asOf: { type: string, format: date-time }
        last5:
          $ref: "#/components/schemas/FormWindow"
        last10:
          $ref: "#/components/schemas/FormWindow"
        last20:
          $ref: "#/components/schemas/FormWindow"
        currentStreakType:
          type: [string, "null"]
          enum: [W, L, null]
        currentStreakLength: { type: number }
        results:
          type: array
          items:
            $ref: "#/components/schemas/FormResult"
        surfaceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/FormSurface"
    FormWindow:
      type: object
      required: [window, availableMatches, wins, losses, winPercentage, pattern]
      properties:
        window: { type: number }
        availableMatches: { type: number }
        wins: { type: number }
        losses: { type: number }
        winPercentage: { type: number }
        pattern:
          type: array
          items:
            type: string
            enum: [W, L]
    FormResult:
      type: object
      required: [id, date, tournamentName, surface, opponent, result, winnerId, resultSummary]
      properties:
        id: { type: number }
        date: { type: string, format: date-time }
        tournamentName: { type: string }
        surface: { type: string }
        opponent:
          $ref: "#/components/schemas/Player"
        result:
          type: string
          enum: [W, L]
        winnerId: { type: number }
        resultSummary: { type: [string, "null"] }
    FormSurface:
      type: object
      required: [surface, availableMatches, wins, losses, winPercentage]
      properties:
        surface: { type: string }
        availableMatches: { type: number }
        wins: { type: number }
        losses: { type: number }
        winPercentage: { type: number }
    Dashboard:
      type: object
      required: [sport, today, live, upcoming, completed]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        today:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        live:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        completed:
          type: array
          items:
            $ref: "#/components/schemas/Match"
    PlayerDetail:
      type: object
      required: [player, recentMatches, wins, losses, winPercentage]
      properties:
        player:
          $ref: "#/components/schemas/Player"
        recentMatches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        wins: { type: number }
        losses: { type: number }
        winPercentage: { type: number }
    TournamentDetail:
      type: object
      required: [tournament, upcomingMatches, completedMatches]
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        upcomingMatches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        completedMatches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
    SearchResults:
      type: object
      required: [players, tournaments, matches]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        tournaments:
          type: array
          items:
            $ref: "#/components/schemas/Tournament"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"

